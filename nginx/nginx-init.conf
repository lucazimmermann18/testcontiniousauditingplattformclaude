# ── INITIAL config (HTTP only) ────────────────────────────────────────
# Used BEFORE the SSL certificate exists.
# Step 1: copy this to nginx.conf → start containers → get cert
# Step 2: replace with nginx.conf (HTTPS) → reload nginx

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Continuum Audit — SSL setup in progress';
        add_header Content-Type text/plain;
    }
}
